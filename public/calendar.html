<!doctype html><meta charset="utf-8"><title>Todo 日历</title><style>body{font:14px Segoe UI,Microsoft YaHei;margin:0;padding:20px;background:#f6f8f6;color:#293b37}header{display:flex;gap:12px;align-items:center}header h1{flex:1}.tabs button,header button{border:0;border-radius:7px;padding:8px 12px;background:#e7f0e9}.tabs{display:flex;gap:8px;margin:14px 0}.on{background:#327d60!important;color:#fff}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.grid>*{padding:8px}.grid small{text-align:center;color:#82938a}.day{min-height:50px;background:#fff;border:1px solid #dce5df;border-radius:7px}.holiday{background:#fff0ed}.work{background:#eaf5ed}.rest{background:#f0f1f0}.today{outline:2px solid #327d60}.day em{display:block;font-size:10px;margin-top:8px;font-style:normal}</style><header><h1>Todo 日历</h1><button id=p>‹</button><b id=t></b><button id=n>›</button></header><div class=tabs><button class=on data-m=work>工作日历</button><button data-m=trade>交易日日历</button><button id=u>手动更新</button></div><div class=grid id=g></div><p id=s>内置中国节假日和调休规则</p><script>const H={"2026-01-01":"元旦","2026-02-17":"春节","2026-04-05":"清明节","2026-05-01":"劳动节","2026-06-19":"端午节","2026-09-25":"中秋节","2026-10-01":"国庆节"},W=new Set(["2026-02-14","2026-02-28","2026-05-09","2026-09-20","2026-10-10"]);let d=new Date(),m='work';const pad=n=>String(n).padStart(2,'0'),key=n=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(n)}`;function draw(){let y=d.getFullYear(),mo=d.getMonth(),f=new Date(y,mo,1).getDay(),l=new Date(y,mo+1,0).getDate();t.textContent=`${y}年${mo+1}月`;g.innerHTML=['日','一','二','三','四','五','六'].map(x=>`<small>${x}</small>`).join('')+'<i></i>'.repeat(f);for(let n=1;n<=l;n++){let q=new Date(y,mo,n),k=key(n),h=H[k],work=W.has(k)||(q.getDay()>0&&q.getDay()<6&&!h),trade=work&&!h;g.insertAdjacentHTML('beforeend',`<div class="day ${h?'holiday ':''}${work?'work ':''}${m==='trade'&&!trade?'rest ':''}${q.toDateString()===new Date().toDateString()?'today':''}"><b>${n}</b><em>${m==='trade'?(trade?'交易日':'休市'):(h||(!work?'周末':'工作日'))}</em></div>`)}}p.onclick=()=>{d.setMonth(d.getMonth()-1);draw()};n.onclick=()=>{d.setMonth(d.getMonth()+1);draw()};document.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{document.querySelector('.on').classList.remove('on');x.classList.add('on');m=x.dataset.m;draw()});u.onclick=()=>s.textContent='联网更新功能将在下一版接入';draw()</script>
