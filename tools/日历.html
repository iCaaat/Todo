<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo 日历</title><style>body{font:14px Segoe UI,Microsoft YaHei,sans-serif;margin:0;background:#f6f8f6;color:#293b37;padding:18px}.bar{display:flex;align-items:center;gap:8px}.bar h1{font-size:20px;flex:1;margin:0}.bar button,.tabs button{border:0;border-radius:7px;background:#e5eee8;padding:7px 10px;color:#416153;cursor:pointer}.tabs{display:flex;gap:6px;margin:16px 0 10px}.tabs .on{background:#327d60;color:#fff}.month{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.month button{border:0;background:transparent;font-size:20px;color:#527163}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.head{text-align:center;color:#85968c;font-size:11px;padding:5px}.day{min-height:52px;border:1px solid #e0e9e3;border-radius:7px;background:#fff;padding:5px}.day b{font-size:12px}.weekend{background:#f1f4f1;color:#9a8178}.holiday{background:#fff0ed;color:#bd5c4d}.work{background:#eaf5ed;color:#387355}.today{outline:2px solid #67a982}.note{font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:#83948b;font-size:11px;margin-top:10px}</style><body><div class="bar"><h1>Todo 日历</h1><button id="update">手动更新</button></div><div class="tabs"><button class="on" data-mode="work">工作日历</button><button data-mode="trade">交易日日历</button></div><div class="month"><button id="prev">‹</button><strong id="title"></strong><button id="next">›</button></div><div class="grid" id="cal"></div><div class="status" id="status">中国大陆节假日与调休；交易日按工作日扣除节假日估算。</div><script>
const state={d:new Date(),mode:'work',holidays:{},updated:''};const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function draw(){const y=state.d.getFullYear(),m=state.d.getMonth();$('title').textContent=`${y}年${m+1}月`;$('cal').innerHTML=['日','一','二','三','四','五','六'].map(x=>`<div class="head">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)$('cal').insertAdjacentHTML('beforeend','<div></div>');for(let n=1;n<=last;n++){const d=new Date(y,m,n),k=key(d),h=state.holidays[k],week=d.getDay(),trade=week>0&&week<6&&!h;let cls='day '+(week===0||week===6?'weekend ':'')+(h?'holiday ':'')+(trade?'work ':'')+(key(new Date())===k?'today':'');let note=h?.name||(state.mode==='trade'?(trade?'交易日':'休市'):'');$('cal').insertAdjacentHTML('beforeend',`<div class="${cls}"><b>${n}</b><div class="note">${note}</div></div>`)}$('status').textContent=`${state.mode==='work'?'工作日历':'中国A股交易日日历'} · ${state.updated?'已更新 '+state.updated:'可点击“手动更新”联网获取'}`}
async function update(){ $('status').textContent='正在更新…';try{const y=state.d.getFullYear();const r=await fetch(`https://timor.tech/api/holiday/year/${y}`);const j=await r.json();state.holidays={};Object.entries(j.holiday||{}).forEach(([k,v])=>{if(v&&v.holiday)state.holidays[k]={name:v.name||'节假日'}});state.updated=new Date().toLocaleString();draw()}catch(e){$('status').textContent='更新失败，请检查网络连接；当前显示周末规则。';draw()}}
$('prev').onclick=()=>{state.d.setMonth(state.d.getMonth()-1);draw()};$('next').onclick=()=>{state.d.setMonth(state.d.getMonth()+1);draw()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.mode=b.dataset.mode;draw()});$('update').onclick=update;draw();update();</script></body></html>
